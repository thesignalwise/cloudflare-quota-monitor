<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Quota Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="settings-page dashboard-page">
  <div class="settings-shell">
    <aside class="settings-nav">
      <div class="brand">
        <img class="brand-logo" src="icons/icon48.png" alt="" />
        <div class="brand-copy">
          <h1 class="brand-title">Quota Monitor</h1>
          <p class="brand-subtitle"><span id="sidebarVersion">v0.3.3</span> · Extension settings</p>
        </div>
      </div>
      <nav class="settings-nav-list" aria-label="Settings sections">
        <a class="settings-nav-item" href="options.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 12h6M7 6h10M7 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>API Configuration</span>
        </a>
        <a class="settings-nav-item" href="webdav.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18.5h12a3 3 0 0 0 .5-5.96A5 5 0 0 0 9 10a3.8 3.8 0 0 0-3 8.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v8m0 0-3-3m3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>WebDAV Backup</span>
        </a>
        <a class="settings-nav-item" href="services.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Monitored Services</span>
        </a>
        <a class="settings-nav-item" href="schedule.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2"/></svg>
          <span>Sync Schedule</span>
        </a>
        <a class="settings-nav-item" href="about.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 17v-6M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2"/></svg>
          <span>About</span>
        </a>
        <a class="settings-nav-item" href="privacy.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5 6v5c0 4.2 2.8 8.1 7 10 4.2-1.9 7-5.8 7-10V6l-7-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Privacy</span>
        </a>
        <a class="settings-nav-item is-active" href="dashboard.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Dashboard</span>
        </a>
              <a class="settings-nav-item" href="release-notes.html"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h7l3 3v13H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 4v4h4M8 12h7M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Release Notes</span></a>
      </nav>
      <div class="settings-nav-footer">
        <a class="nav-footer-link" href="https://thesignalwise.com" target="_blank" rel="noreferrer" aria-label="Official website">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="2"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3c2.1 2.3 3.2 5.3 3.2 9S14.1 18.7 12 21c-2.1-2.3-3.2-5.3-3.2-9S9.9 5.3 12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
        <a class="nav-footer-link" href="https://github.com/thesignalwise/cloudflare-quota-monitor" target="_blank" rel="noreferrer" aria-label="GitHub repository">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18c-2.2.7-2.2-1.1-3.1-1.3M15.5 21v-3.9c0-1.1.1-1.5-.5-2.1 2.8-.3 5.7-1.4 5.7-6.1 0-1.4-.5-2.5-1.3-3.4.1-.3.6-1.7-.1-3.4 0 0-1.1-.3-3.5 1.3a12 12 0 0 0-6.4 0C7 1.8 5.9 2.1 5.9 2.1c-.7 1.7-.2 3.1-.1 3.4A5.1 5.1 0 0 0 4.5 9c0 4.7 2.9 5.8 5.7 6.1-.4.4-.7.9-.8 1.7V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </aside>

    <main class="settings-main settings-main--wide">
      <section class="page-heading">
        <div>
          <h1>Usage Overview</h1>
          <p>Monitoring your service limits across the global network.</p>
        </div>
        <div class="heading-actions">
          <div class="segmented-control" aria-label="Dashboard display mode">
            <button id="cardViewBtn" class="segment-btn is-active" type="button" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5h6v6H4V5ZM14 5h6v6h-6V5ZM4 15h6v4H4v-4ZM14 15h6v4h-6v-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
              <span>Cards</span>
            </button>
            <button id="listViewBtn" class="segment-btn" type="button" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span>List</span>
            </button>
          </div>
          <button id="refreshDashboard" class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.66 5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 12A8 8 0 0 1 17.66 6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M17 2v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 22v-5H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-label>Refresh</span>
          </button>
          <button class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Export Report</span>
          </button>
          <a class="btn btn--primary" href="options.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04a2.1 2.1 0 0 1-2.97 2.97l-.04-.04A1.7 1.7 0 0 0 14.9 19.5a1.7 1.7 0 0 0-1.02 1.56V21a2.1 2.1 0 0 1-4.2 0v-.06A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.04.04a2.1 2.1 0 0 1-2.97-2.97l.04-.04A1.7 1.7 0 0 0 4.1 14.9a1.7 1.7 0 0 0-1.56-1.02H2.5a2.1 2.1 0 0 1 0-4.2h.06A1.7 1.7 0 0 0 4.1 8.6a1.7 1.7 0 0 0-.34-1.88l-.04-.04a2.1 2.1 0 0 1 2.97-2.97l.04.04A1.7 1.7 0 0 0 8.6 4.1a1.7 1.7 0 0 0 1.02-1.56V2.5a2.1 2.1 0 0 1 4.2 0v.06A1.7 1.7 0 0 0 14.9 4.1a1.7 1.7 0 0 0 1.88-.34l.04-.04a2.1 2.1 0 0 1 2.97 2.97l-.04.04A1.7 1.7 0 0 0 19.4 8.6a1.7 1.7 0 0 0 1.56 1.02H21a2.1 2.1 0 0 1 0 4.2h-.06A1.7 1.7 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Manage Limits</span>
          </a>
        </div>
      </section>

      <section id="dashboard-content" class="dashboard-content is-card-view" aria-label="Quota dashboard"></section>
      <div class="dashboard-footer">
        <p class="footer-note">Data updates once per day automatically. <span id="dashboardSummary">Last 30 samples</span>.</p>
      </div>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>

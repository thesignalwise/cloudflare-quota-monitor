    <main class="settings-main">
      <section class="page-heading">
        <div>
          <h1>Monitored Services</h1>
          <p>Coverage status for each Cloudflare usage source.</p>
        </div>
        <div class="heading-actions">
          <span class="summary-badge">13 service groups</span>
          <span class="summary-badge" id="headerVersion">v0.3.1</span>
        </div>
      </section>

      <div class="settings-stack">
        <section class="settings-card" id="monitored-services">
          <div class="settings-card__header">
            <h3>Telemetry coverage</h3>
            <span class="status-badge is-good">Enabled</span>
          </div>
          <div class="service-check-grid">
            <label><input type="checkbox" checked disabled /><span>Workers</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Pages</span><em>REST</em></label>
            <label><input type="checkbox" checked disabled /><span>KV</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>D1</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>R2</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Queues</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Hyperdrive</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Browser Run</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Workers Logs</span><em>Partial</em></label>
            <label><input type="checkbox" checked disabled /><span>Analytics Engine</span><em>Partial</em></label>
            <label><input type="checkbox" checked disabled /><span>Workflows</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Workers AI</span><em>GraphQL</em></label>
            <label><input type="checkbox" checked disabled /><span>Durable Objects</span><em>GraphQL</em></label>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>

</html>

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Extension Popup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed": "#311300",
                    "on-surface-variant": "#564336",
                    "secondary": "#5f5e5e",
                    "on-tertiary-fixed": "#001e2f",
                    "inverse-surface": "#2e3132",
                    "surface": "#f8f9fa",
                    "on-secondary-fixed": "#1c1b1b",
                    "on-background": "#191c1d",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-high": "#e7e8e9",
                    "on-primary-fixed-variant": "#723600",
                    "surface-variant": "#e1e3e4",
                    "secondary-fixed": "#e5e2e1",
                    "surface-bright": "#f8f9fa",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#ffb787",
                    "on-error-container": "#93000a",
                    "surface-tint": "#964900",
                    "on-surface": "#191c1d",
                    "secondary-fixed-dim": "#c8c6c5",
                    "primary": "#964900",
                    "secondary-container": "#e2dfde",
                    "on-secondary-container": "#636262",
                    "error": "#ba1a1a",
                    "on-primary-container": "#592900",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#004c6e",
                    "on-tertiary-container": "#003a56",
                    "tertiary-fixed": "#c9e6ff",
                    "primary-container": "#f38020",
                    "tertiary-fixed-dim": "#89ceff",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container-highest": "#e1e3e4",
                    "outline": "#8a7264",
                    "surface-dim": "#d9dadb",
                    "outline-variant": "#ddc1b1",
                    "surface-container": "#edeeef",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#00a9f0",
                    "background": "#f8f9fa",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-primary": "#ffb787",
                    "tertiary": "#006591",
                    "on-secondary-fixed-variant": "#474746",
                    "primary-fixed": "#ffdcc7",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter": "24px",
                    "xl": "32px",
                    "sm": "8px",
                    "md": "16px",
                    "margin": "24px",
                    "lg": "24px",
                    "container-max": "1280px",
                    "base": "4px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-sm": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "body-sm": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                    "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                    "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for popup feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e1e3e4; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c8c6c5; }
    </style>
</head>
<body class="bg-surface-dim min-h-screen flex items-center justify-center p-md font-body-md text-on-surface">
<!-- Extension Popup Container (Simulated fixed width) -->
<main class="w-[400px] h-[600px] bg-surface flex flex-col rounded-xl shadow-2xl ring-1 ring-surface-variant overflow-hidden relative">
<!-- TopAppBar Header (from JSON) -->
<header class="bg-surface shadow-sm docked full-width top-0 z-10 shrink-0">
<div class="flex justify-between items-center w-full px-md py-sm max-w-container-max mx-auto">
<div class="font-headline-md text-headline-md font-bold text-primary truncate">
                    Cloudflare Quota Monitor
                </div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform hover:text-primary-container" data-icon="refresh">refresh</span>
</div>
</div>
<!-- Navigation Links (Compact for Popup) -->
<nav class="flex px-md gap-md border-b border-surface-variant bg-surface-container-low overflow-x-auto no-scrollbar">
<div class="text-on-surface-variant font-medium font-label-md text-label-md py-sm cursor-pointer hover:text-primary transition-colors duration-200">
                    Dashboard
                </div>
<div class="text-primary font-bold border-b-2 border-primary pb-1 font-label-md text-label-md py-sm cursor-pointer hover:text-primary transition-colors duration-200">
                    Popup
                </div>
<div class="text-on-surface-variant font-medium font-label-md text-label-md py-sm cursor-pointer hover:text-primary transition-colors duration-200">
                    Settings
                </div>
</nav>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto p-md flex flex-col gap-sm bg-surface-container-lowest">
<!-- Overview Summary -->
<div class="flex items-center justify-between mb-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Current Usage</h2>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-container py-xs px-sm rounded-full">Updated 2m ago</span>
</div>
<!-- Workers Quota Card (Warning state) -->
<div class="bg-surface-container-low rounded-lg p-md border border-surface-variant flex flex-col gap-xs transition-colors hover:bg-surface-container">
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="terminal">terminal</span>
<span class="font-label-md text-label-md font-bold">Workers</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">85k / 100k requests</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 mt-xs overflow-hidden">
<div class="bg-primary-container h-2 rounded-full transition-all duration-500" style="width: 85%"></div>
</div>
<div class="text-right font-label-md text-label-md text-primary-container mt-xs">85% - Nearing Limit</div>
</div>
<!-- Pages Quota Card (Good state) -->
<div class="bg-surface-container-low rounded-lg p-md border border-surface-variant flex flex-col gap-xs transition-colors hover:bg-surface-container">
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface">
<span class="material-symbols-outlined text-[18px] text-tertiary" data-icon="web">web</span>
<span class="font-label-md text-label-md font-bold">Pages</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">120 / 500 builds</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 mt-xs overflow-hidden">
<div class="bg-tertiary h-2 rounded-full transition-all duration-500" style="width: 24%"></div>
</div>
</div>
<!-- KV Quota Card (Good state) -->
<div class="bg-surface-container-low rounded-lg p-md border border-surface-variant flex flex-col gap-xs transition-colors hover:bg-surface-container">
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface">
<span class="material-symbols-outlined text-[18px] text-tertiary" data-icon="database">database</span>
<span class="font-label-md text-label-md font-bold">KV Reads</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">1.2M / 10M reads</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 mt-xs overflow-hidden">
<div class="bg-tertiary h-2 rounded-full transition-all duration-500" style="width: 12%"></div>
</div>
</div>
<!-- D1 Quota Card (Critical state) -->
<div class="bg-surface-container-low rounded-lg p-md border border-error-container flex flex-col gap-xs transition-colors hover:bg-error-container/20">
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-error">
<span class="material-symbols-outlined text-[18px]" data-icon="storage">storage</span>
<span class="font-label-md text-label-md font-bold">D1 Database</span>
</div>
<span class="font-body-sm text-body-sm text-error">4.8GB / 5.0GB size</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 mt-xs overflow-hidden">
<div class="bg-error h-2 rounded-full transition-all duration-500" style="width: 96%"></div>
</div>
<div class="text-right font-label-md text-label-md text-error mt-xs font-bold">96% - Action Required</div>
</div>
<!-- R2 Quota Card (Warning state) -->
<div class="bg-surface-container-low rounded-lg p-md border border-surface-variant flex flex-col gap-xs transition-colors hover:bg-surface-container">
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="cloud">cloud</span>
<span class="font-label-md text-label-md font-bold">R2 Storage</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">7.5GB / 10GB</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 mt-xs overflow-hidden">
<div class="bg-primary-container h-2 rounded-full transition-all duration-500" style="width: 75%"></div>
</div>
</div>
<!-- Extra spacer to ensure scroll content clears the fixed footer -->
<div class="h-md"></div>
</div>
<!-- Sticky Bottom Action -->
<div class="bg-surface p-md border-t border-surface-variant shrink-0">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-sm px-md rounded-DEFAULT flex items-center justify-center gap-xs transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span>View Full Dashboard</span>
<span class="material-symbols-outlined text-[18px]" data-icon="open_in_new">open_in_new</span>
</button>
</div>
</main>
</body></html>
